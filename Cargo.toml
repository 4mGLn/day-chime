[package]
name = "day-chime"
version = "0.4.0"
edition = "2021"
default-run = "day-chime"
description = "DaouOffice attendance based desktop reminder"
license = "MIT"
repository = "https://github.com/4mGLn/day-chime"
authors = ["4mGLn"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
dirs = "6"
fs2 = "0.4"
notify-rust = "4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
